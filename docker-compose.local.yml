# Deploy standalone num servidor local NOVO — diferente de
# docker-compose.vps.yml (que assume Traefik e um Postgres compartilhado
# já rodando na VPS), este sobe TUDO nesta própria máquina: Postgres
# dedicado + backend + frontend, publicando as portas direto na rede
# interna. Sem Traefik, sem HTTPS/Let's Encrypt — não precisa, a máquina
# não fica exposta à internet (rede interna do hospital/empresa).
#
# Uso (ver docs/05_INSTALACAO_SERVIDOR_LOCAL.md para o passo a passo
# completo, incluindo como descobrir o IP fixo desta máquina):
#   cp .env.local.example .env   # preencher com os valores reais
#   docker compose -f docker-compose.local.yml up -d --build
#
# Depois do primeiro up, rodar os seeds uma vez:
#   docker compose -f docker-compose.local.yml exec backend python scripts/seed_usuarios.py
#   docker compose -f docker-compose.local.yml exec backend python scripts/seed_setores.py
services:
  postgres:
    image: postgres:16
    container_name: almoxarifado-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: almoxarifado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: almoxarifado
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - almoxarifado

  backend:
    build: ./backend
    container_name: almoxarifado-backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - almoxarifado

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_ORGANIZACAO: ${VITE_ORGANIZACAO}
        VITE_HOSPITAL_NOME: ${VITE_HOSPITAL_NOME}
        VITE_HOSPITAL_SIGLA: ${VITE_HOSPITAL_SIGLA}
    container_name: almoxarifado-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - almoxarifado

networks:
  almoxarifado:

volumes:
  pgdata:
